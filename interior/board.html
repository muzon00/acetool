<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>상담 안내판 · ACE</title>
<meta name="theme-color" content="#1d3557">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인테리어 견적">
<style>
/* 🖼 상담 안내판 — 매장 안내판 사진(반듯하게 펴고 밝게 보정)을 태블릿 전체 화면으로. 가볍게: 그림 한 장씩만 불러오고 옆 장은 미리 받아 둠 */
:root { --navy: #1d3557; --red: #d71920; --ink: #172033; --ink3: #8a94a6; --line: #dfe4ec; --app-h: 100vh; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; background: #2b3240; color: var(--ink); overflow: hidden; }
button { font: inherit; cursor: pointer; }
.app { height: 100vh; height: var(--app-h); display: flex; flex-direction: column; }
.top { background: var(--navy); color: #fff; padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: none; }
.apptabs { display: flex; gap: 4px; background: rgba(255,255,255,.1); border-radius: 12px; padding: 3px; }
.apptabs a { color: #cfd8e6; text-decoration: none; font-weight: 800; padding: 7px 12px; border-radius: 9px; font-size: .92em; }
.apptabs a.on { background: #fff; color: var(--navy); }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tabs button { flex: none; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; border-radius: 10px; padding: 0 14px; min-height: 42px; font-weight: 800; white-space: nowrap; }
.tabs button.on { background: #fff; color: var(--navy); }
.tools { display: flex; gap: 6px; margin-left: auto; }
.tools button { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; border-radius: 10px; min-height: 42px; padding: 0 12px; font-weight: 800; }
.stage { flex: 1; min-height: 0; position: relative; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y pinch-zoom; }
.stage .pg { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 8px; }
.stage img { display: block; max-width: 100%; max-height: calc(var(--app-h) - 74px); width: auto; height: auto; background: #fff; border-radius: 6px; box-shadow: 0 6px 30px rgba(0,0,0,.35); }
body.wide .stage .pg { align-items: flex-start; }
body.wide .stage img { max-height: none; width: 100%; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); width: 56px; height: 96px; border: 0; border-radius: 14px; background: rgba(23,32,51,.45); color: #fff; font-size: 30px; z-index: 3; }
.nav.l { left: 8px; } .nav.r { right: 8px; }
.nav:disabled { display: none; }
.dots { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 6px; z-index: 3; background: rgba(23,32,51,.45); padding: 6px 10px; border-radius: 999px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.45); } .dots i.on { background: #fff; }
.load { color: #cfd8e6; font-weight: 700; }
/* 추가 시공비 단가표: 안내판 양식 그대로 (검은 제목줄 · NO · 공종 · 내용 · 소비자가 · 비고) */
.sheet { background: #fff; width: min(1180px, 100%); padding: 18px 18px 22px; border-radius: 6px; box-shadow: 0 6px 30px rgba(0,0,0,.35); }
.sheet .tt { background: #111; color: #fff; text-align: center; font-weight: 900; font-size: 1.45em; letter-spacing: .3em; padding: 8px; }
.sheet .base { text-align: right; font-size: .85em; color: #333; border: 1px solid #333; border-top: 0; padding: 4px 8px; }
table.wk { width: 100%; border-collapse: collapse; font-size: 15px; }
table.wk th { background: #b9bcc2; border: 1px solid #333; padding: 6px; font-weight: 800; }
table.wk td { border: 1px solid #333; padding: 6px 8px; vertical-align: middle; }
table.wk td.no { text-align: center; width: 44px; color: #333; }
table.wk td.g { text-align: center; font-weight: 800; background: #f4f5f7; width: 170px; }
table.wk td.n { text-align: center; }
table.wk td.p { text-align: right; font-weight: 800; white-space: nowrap; width: 120px; font-variant-numeric: tabular-nums; }
table.wk td.m { font-size: .86em; color: #333; line-height: 1.45; }
table.wk tr.cx td.n, table.wk tr.cx td.p, table.wk tr.cx td.m, table.wk td.g.cx { color: var(--red); }
body.wide .sheet { width: 100%; }
@media (max-width: 760px) { table.wk { font-size: 12.5px; } table.wk td.g { width: 92px; } table.wk td.m { min-width: 140px; } .sheet { padding: 8px; } .nav { width: 40px; height: 72px; font-size: 22px; } .apptabs a { padding: 7px 8px; font-size: .82em; } }
:fullscreen .top, body.fs .top { display: none; }
body.fs .stage img { max-height: calc(var(--app-h) - 16px); }
.exitfs { display: none; position: absolute; right: 10px; top: 10px; z-index: 4; border: 0; border-radius: 10px; background: rgba(23,32,51,.6); color: #fff; font-weight: 800; min-height: 44px; padding: 0 14px; }
body.fs .exitfs { display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="apptabs"><a href="index.html">🧾 상품 견적</a><a href="package.html">🏠 전체 인테리어</a><a href="board.html" class="on">🖼 상담 안내판</a></div>
    <div class="tabs" id="tabs"></div>
    <div class="tools"><button type="button" id="wideBtn" title="글씨가 작으면 눌러서 가로를 꽉 채워 크게 보고 위아래로 밀어요">🔍 크게</button><button type="button" id="fsBtn">⛶ 전체 화면</button></div>
  </div>
  <div class="stage" id="stage"><div class="pg" id="pg"><span class="load">불러오는 중…</span></div>
    <button class="nav l" id="prev" type="button" aria-label="이전">‹</button><button class="nav r" id="next" type="button" aria-label="다음">›</button>
    <button class="exitfs" id="exitFs" type="button">✕ 전체 화면 끝내기</button>
    <div class="dots" id="dots"></div>
  </div>
</div>
<script src="sets.js?v=1"></script>
<script>
'use strict';
(function () { function f() { document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px'); } f(); addEventListener('resize', f); addEventListener('orientationchange', function () { setTimeout(f, 300); }); })();
const PAGES = [
  { k: 'set1', t: '🛁 세트 01~05', img: 'board/set1.jpg?v=1' },
  { k: 'set2', t: '🛁 세트 06~09', img: 'board/set2.jpg?v=1' },
  { k: 'pkg1', t: '📦 패키지 01~05', img: 'board/pkg1.jpg?v=1' },
  { k: 'pkg2', t: '📦 패키지 06~09', img: 'board/pkg2.jpg?v=1' },
  { k: 'work', t: '🛠 추가 시공비', work: true }];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let cur = 0; try { cur = Math.max(0, PAGES.findIndex(p => p.k === (localStorage.getItem('int.board') || 'set1'))); } catch (e) { }
function workHtml() {
  const B = window.BATH || { work: [] }, W = B.work; let h = '<div class="sheet"><div class="tt">추가 시공비 단가표</div><div class="base">기준: ' + esc(B.workBase || '') + '</div><table class="wk"><tr><th>NO</th><th>공 종</th><th>내 용</th><th>소비자가(VAT+)</th><th>비 고</th></tr>';
  W.forEach((w, i) => {
    let span = 0; if (i === 0 || W[i - 1][0] !== w[0]) { span = 1; while (W[i + span] && W[i + span][0] === w[0]) span++; }
    const cx = w[0] === '취소';
    h += '<tr' + (cx ? ' class="cx"' : '') + '><td class="no">' + (i + 1) + '</td>' + (span ? '<td class="g' + (cx ? ' cx' : '') + '" rowspan="' + span + '">' + esc(w[0]) + '</td>' : '') + '<td class="n">' + esc(w[1]) + '</td><td class="p">' + w[2].toLocaleString('ko-KR') + '</td><td class="m">' + esc(w[3]) + '</td></tr>';
  });
  return h + '</table></div>';
}
function show(i) {
  cur = (i + PAGES.length) % PAGES.length; const P = PAGES[cur];
  try { localStorage.setItem('int.board', P.k); } catch (e) { }
  $('tabs').innerHTML = PAGES.map((p, k) => '<button type="button" data-p="' + k + '" class="' + (k === cur ? 'on' : '') + '">' + p.t + '</button>').join('');
  $('dots').innerHTML = PAGES.map((p, k) => '<i class="' + (k === cur ? 'on' : '') + '"></i>').join('');
  $('pg').innerHTML = P.work ? workHtml() : '<img src="' + P.img + '" alt="' + esc(P.t) + ' 안내판">';
  $('stage').scrollTop = 0; $('stage').scrollLeft = 0;
  const on = $('tabs').querySelector('.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  /* 옆 장 미리 받아 두기 (넘길 때 바로 나오게) */
  [cur + 1, cur - 1].forEach(k => { const q = PAGES[(k + PAGES.length) % PAGES.length]; if (q.img) { const im = new Image(); im.src = q.img; } });
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) show(+b.dataset.p); });
$('prev').addEventListener('click', () => show(cur - 1));
$('next').addEventListener('click', () => show(cur + 1));
addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'PageDown') show(cur + 1); if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(cur - 1); if (e.key === 'Escape') exitFs(); });
/* 손가락으로 옆으로 밀면 넘김 (크게 보기에서 그림이 옆으로 넘칠 때는 스크롤 먼저) */
let sx = 0, sy = 0, st = 0, multi = false;
$('stage').addEventListener('touchstart', e => { multi = e.touches.length > 1; sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }, { passive: true });
$('stage').addEventListener('touchend', e => {
  if (multi || (window.visualViewport && visualViewport.scale > 1.05)) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy, S = $('stage');
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - st < 700 && S.scrollWidth <= S.clientWidth + 2) show(cur + (dx < 0 ? 1 : -1));
}, { passive: true });
/* 🔍 크게: 가로를 꽉 채우고 위아래로 밀어 보기 (기기마다 기억) */
function setWide(w) { document.body.classList.toggle('wide', w); $('wideBtn').textContent = w ? '🔎 한 화면에' : '🔍 크게'; try { localStorage.setItem('int.boardWide', w ? '1' : '0'); } catch (e) { } }
let wide = false; try { wide = localStorage.getItem('int.boardWide') === '1'; } catch (e) { }
$('wideBtn').addEventListener('click', () => setWide(!document.body.classList.contains('wide')));
/* ⛶ 전체 화면: 되면 기기 전체 화면, 안 되는 기기(오래된 아이패드 등)는 위 메뉴만 숨김 */
function enterFs() { const el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen; document.body.classList.add('fs'); if (rq) { try { const p = rq.call(el); if (p && p.catch) p.catch(() => { }); } catch (e) { } } }
function exitFs() { document.body.classList.remove('fs'); const ex = document.exitFullscreen || document.webkitExitFullscreen; if ((document.fullscreenElement || document.webkitFullscreenElement) && ex) { try { ex.call(document); } catch (e) { } } }
$('fsBtn').addEventListener('click', enterFs); $('exitFs').addEventListener('click', exitFs);
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('fs'); });
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
setWide(wide); show(cur);
</script>
</body>
</html>
