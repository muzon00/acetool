<style>

.steps button.on { border-color: var(--navy); color: var(--navy); } .steps button.on b { background: var(--navy); color: #fff; } .steps button.done b { background: var(--ok); color: #fff; }

.card h2 { margin: 0 0 10px; font-size: 1.15em; }
.mrow { display: grid; grid-template-columns: 1.3fr 1fr 2fr 1.4fr; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f2f6; }

.bars { height: 8px; border-radius: 4px; background: #e6eaf1; overflow: hidden; } .bars i { display: block; height: 100%; background: var(--ok); }

.nextbar .btn { min-height: 52px; font-size: 1.05em; }
.info { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }

.infobox summary { cursor: pointer; font-weight: 800; min-height: 32px; }
.psearch { position: relative; } .psearch .pl { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.15); max-height: 300px; overflow: auto; }
.psearch .pl div { padding: 8px 12px; border-bottom: 1px solid #f0f2f6; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; } .psearch .pl div:hover { background: #f3f7fc; }

.doc .dh h1 { margin: 0; font-size: 2em; letter-spacing: .4em; text-align: center; }
.doc .dh .sub { text-align: right; color: #555; }
.doc .to { font-size: 1.3em; font-weight: 800; border-bottom: 2px solid #111; padding-bottom: 4px; margin-bottom: 8px; }
.doc .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
.doc table { width: 100%; border-collapse: collapse; }
.doc .kvt td, .doc .kvt th { border: 1px solid #999; padding: 4px 6px; text-align: left; } .doc .kvt th { background: #f2f2f2; width: 82px; font-weight: 700; }
.doc .amt { border: 2px solid #111; padding: 8px 10px; font-size: 1.15em; font-weight: 800; margin: 8px 0 12px; display: flex; justify-content: space-between; }
.doc h3 { font-size: 1.05em; margin: 14px 0 6px; }
.doc .lt th { background: #e9eef5; border: 1px solid #999; padding: 5px 4px; font-size: .92em; }
.doc .lt td { border: 1px solid #bbb; padding: 4px 5px; } .doc .lt td.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; } .doc .lt td.c { text-align: center; }
.doc .lt tr.s td { background: #fff7e0; font-weight: 800; } .doc .lt tr.t td { background: #f4f6f9; font-weight: 800; }
.doc .tot td { border: 1px solid #999; padding: 6px 8px; } .doc .tot td:first-child { background: #f2f2f2; font-weight: 700; width: 40%; } .doc .tot td.r { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.doc .tot tr.g td { font-size: 1.15em; background: #fff3f3; }

#docPrint { display: none; }
@media print {
  @page { size: A4; margin: 8mm; }
  body { overflow: visible; background: #fff; }

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = n => Math.round(n).toLocaleString('ko-KR');
const qf = n => Number.isInteger(n) ? n.toLocaleString('ko-KR') : n.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
let toastT = null; function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = 'none'; }, 2200); }
const LS = { get(k, d) { try { const v = localStorage.getItem('int.pkg.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('int.pkg.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } } };
const hn = v => String(v == null ? '' : v).replace(/\s+/g, '');
/* 숫자 읽기: 빈칸 → null, 못 읽으면 NaN (조용히 0으로 바꾸지 않음) */
function num(v) { if (typeof v === 'number') return Number.isFinite(v) ? v : NaN; const t = String(v == null ? '' : v).replace(/[,\s원₩]/g, ''); if (t === '' || t === '-') return null; const n = Number(t); return Number.isFinite(n) ? n : NaN; }
const nz = v => (v == null || Number.isNaN(v)) ? 0 : v;
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
let uid = Date.now() % 100000; const nid = () => 'i' + (++uid);

/* ===== 업체 견적서 읽기: 머리글(1줄 · 재료비/노무비 2줄) · 공종 제목 줄 · 소계 · 공과잡비/이윤/부가세 ===== */
const NAME_RE = /^(품명|품목|항목|내역|명칭|공사명|공사내용|작업내용|품명및규격|세부내역|내용)$/, SEC_RE = /^(공종|구분|공정|분류)$/;
const TOTAL_RE = /소계|합\s*계|총\s*계|총\s*액|총공사비|직접공사비/, VAT_RE = /부가세|부가가치세|VAT/i, SUPPLY_RE = /^공급가액?$/, OVER_RE = /공과잡비|기업이윤|이윤|일반관리비|관리비|산재|고용|안전관리|보험료|경비율|절사|단수정리|할인|네고|조정|제경비/;
function parseVendor(aoa) {
  let h = -1;
  for (let i = 0; i < Math.min(aoa.length, 40); i++) { const z = (aoa[i] || []).map(hn); if (z.some(x => NAME_RE.test(x) || SEC_RE.test(x)) && z.some(x => x === '수량' || /금액|합계/.test(x))) { h = i; break; } }
  if (h < 0) return { error: '표의 제목 줄(품명 · 수량 · 금액)을 찾지 못했어요.' };
  const top = (aoa[h] || []).map(hn), sub = (aoa[h + 1] || []).map(hn), two = sub.filter(x => /^(단가|금액)$/.test(x)).length >= 2;
  let carry = ''; const W = Math.max(top.length, sub.length);
  const lab = Array.from({ length: W }, (_, k) => { const t = top[k] || ''; if (t) carry = t; return two && sub[k] ? ((t || carry) + '|' + sub[k]) : t; });
  const at = re => lab.findIndex(x => re.test(x));
  let nc = lab.findIndex(x => NAME_RE.test(x)), sc = lab.findIndex(x => SEC_RE.test(x)); if (nc < 0) { nc = sc; sc = -1; }
  const C = { n: nc, s: sc, sp: at(/^(규격|사양|규격및사양)$/), u: at(/^단위$/), q: at(/^수량$/), m: at(/^비고$/),
    mu: at(/^재료비?\|단가$/), ma: at(/^재료비?\|금액$/), lu: at(/^노무비?\|단가$/), la: at(/^노무비?\|금액$/), eu: at(/^경비\|단가$/), ea: at(/^경비\|금액$/),
    U: at(/^(단가|합계\|단가|계\|단가)$/), A: at(/^(금액|합계|합계\|금액|계\|금액|합계금액|공급가액)$/) };
  const split = C.mu >= 0 || C.lu >= 0;

const fixSel = el => { el.querySelectorAll('select[data-f]').forEach(s => { s.value = String(PK[s.dataset.f]); }); };
/* 우리 상품 넣기 (상품 견적에 올린 상품 목록에서 — 전산 바코드 · 판매가) */
function ourProducts(q) {
  let db = null; try { db = JSON.parse(localStorage.getItem('int.db') || 'null'); } catch (e) { db = null; }
  if (!db) return null; q = hn(q).toLowerCase(); if (!q) return [];
  return db.products.filter(p => (p.n + p.c).toLowerCase().replace(/\s+/g, '').includes(q)).sort((a, b) => (b.k || 0) - (a.k || 0)).slice(0, 12).map(p => { const m = db.bm && db.bm[p.c]; return { c: p.c, n: p.n, p: m && m[1] > 0 ? m[1] : p.p, b: m ? ((m[0] || []).includes(p.b) ? p.b : (m[0] || [])[0] || p.b) : p.b }; });
}
const prodSearch = sid => '<div class="psearch"><input class="cell" style="border:1px solid var(--line);min-height:40px;background:#fff" placeholder="🔎 우리 매장 상품 찾아 넣기 (예: 양변기, 수전)" data-ps="' + sid + '"><div class="pl" hidden></div></div>';

    (sp ? '<th>재료비 단가</th><th>재료비 금액</th><th>노무비 단가</th><th>노무비 금액</th>' : '<th>단가</th>') + '<th>원가 합계</th><th>비고</th><th class="m">마진 %</th><th class="m">판매 단가</th><th class="m">판매 금액</th><th class="m"></th></tr>';
  const colN = sp ? 10 : 7;
  R.secs.forEach(S => {
    h += '<tr class="sec"><td colspan="' + colN + '"><div class="pin"><input class="cell" style="font-weight:800" data-sn="' + S.s.id + '" value="' + esc(S.s.n) + '"></div></td><td class="m"><input class="cell r" data-sm="' + S.s.id + '" placeholder="' + PK.mAll + '" value="' + (S.s.mr ?? '') + '" title="이 공종만 다른 마진"></td><td class="m"></td><td class="m v">' + won(S.sale) + '</td><td class="m"></td></tr>';
    S.rows.forEach(x => { const it = x.it, I = (k, r, v) => '<td><input class="cell' + (r ? ' r' : '') + '" data-it="' + it.id + '" data-k="' + k + '" value="' + esc(v) + '"></td>';
      h += '<tr class="' + (it.src !== 'v' ? 'add' : '') + '">' + I('n', 0, it.n) + I('sp', 0, it.sp) + I('u', 0, it.u) + I('q', 1, qf(it.q)) +
        (sp ? I('mu', 1, won(it.mu)) + '<td class="v">' + won(it.mu * it.q) + '</td>' + I('lu', 1, won(it.lu)) + '<td class="v">' + won((it.lu + it.eu) * it.q) + '</td>' : I('uc', 1, won(it.uc))) +
        '<td class="v">' + won(x.cost) + '</td>' + I('memo', 0, it.memo) + '<td class="m">' + (it.src === 'prod' ? '<span class="muted" style="font-size:.8em">판매가</span>' : '<input class="cell r" data-it="' + it.id + '" data-k="mr" placeholder="' + (S.s.mr ?? PK.mAll) + '" value="' + (it.mr ?? '') + '">') + '</td><td class="m v">' + won(x.su) + '</td><td class="m v"><b>' + won(x.sa) + '</b></td><td class="m"><button class="del" data-del="' + it.id + '" type="button">✕</button></td></tr>'; });
    h += '<tr class="sub"><td colspan="' + (colN + 4) + '"><div class="pin"><button class="addrow" data-addi="' + S.s.id + '" type="button">＋ 항목 추가</button> <span class="muted" style="margin-left:8px">소계 원가 ' + won(S.cost) + ' → 판매 ' + won(S.sale) + ' · 이익 ' + won(S.sale - S.cost) + '</span></div></td></tr>';
  });

  el.innerHTML = h; fixSel(el);
}
const infoInputs = () => [['name', '고객명'], ['tel', '연락처'], ['site', '현장 주소'], ['area', '평형 · 면적'], ['period', '공사 기간'], ['date', '견적일'], ['staff', '담당자']].map(([k, t]) => '<div><label>' + t + '<input data-info="' + k + '"' + (k === 'date' ? ' type="date"' : '') + ' value="' + esc(PK.info[k] || '') + '"></label></div>').join('');
/* ===================== 공통: 그리기 · 입력 ===================== */
function render() { const sc0 = document.querySelector('#main .scroll'), y = sc0 ? sc0.scrollTop : 0, x = sc0 ? sc0.scrollLeft : 0; renderA(); const sc = document.querySelector('#main .scroll'); if (sc) { sc.scrollTop = y; sc.scrollLeft = x; } }
const findIt = id => { for (const s of PK.secs) { const i = s.items.findIndex(x => x.id === id); if (i >= 0) return [s, i, s.items[i]]; } return null; };
document.addEventListener('click', e => {
  const t = e.target;
  const a = t.closest('[data-a]');
  if (a) { const k = a.dataset.a;
    if (k === 'example') applyImport(parseVendor(exampleAoa()), '예시 (주)한빛인테리어');
    else if (k === 'exfile') downloadExample();
    else if (k === 'paste') { const tb = $('pasteBox'); if (!tb || !tb.value.trim()) toast('표를 붙여넣어 주세요'); else importPaste(tb.value); }

    else if (k === 'print') printDoc(a.dataset.st);
    return; }
  const ma = t.closest('[data-mall]'); if (ma) { PK.mAll = +ma.dataset.mall; save(); render(); return; }
  const sm = t.closest('[data-secm]'); if (sm) { const s = PK.secs.find(x => x.id === sm.dataset.secm); s.mr = sm.dataset.m === '' ? null : +sm.dataset.m; save(); render(); return; }
  const dl = t.closest('[data-del]'); if (dl) { const f = findIt(dl.dataset.del); if (f) { f[0].items.splice(f[1], 1); PK.secs = PK.secs.filter(s => s.items.length || s.keep); save(); render(); } return; }
  const ai = t.closest('[data-addi]'); if (ai) { const s = PK.secs.find(x => x.id === ai.dataset.addi); s.items.push({ id: nid(), n: '새 항목', sp: '', u: '식', q: 1, mu: 0, lu: 0, eu: 0, uc: 0, ac: 0, memo: '', mr: null, src: 'add' }); save(); render(); toast('줄을 추가했어요 — 이름 · 원가 단가를 적어 주세요'); return; }
  if (t.closest('[data-adds]')) { PK.secs.push({ id: nid(), n: '추가 공종', mr: null, items: [{ id: nid(), n: '새 항목', sp: '', u: '식', q: 1, mu: 0, lu: 0, eu: 0, uc: 0, ac: 0, memo: '', mr: null, src: 'add' }] }); save(); render(); return; }
  const pk = t.closest('[data-pick]'); if (pk) { const p = JSON.parse(pk.dataset.pick); let s = PK.secs.find(x => x.n === '추가 상품 (매장)'); if (!s) PK.secs.push(s = { id: nid(), n: '추가 상품 (매장)', mr: null, items: [] }); s.items.push({ id: nid(), n: p.n, sp: p.c, u: '개', q: 1, mu: 0, lu: 0, eu: 0, uc: 0, ac: 0, memo: '', mr: null, src: 'prod', fix: p.p, bc: p.b }); save(); render(); toast(p.n + ' 넣었어요 (매장 판매가 ' + won(p.p) + '원)'); return; }
});
function setNum(it, k, raw) {
  const v = num(raw); if (v == null || Number.isNaN(v)) { if (k === 'mr') { it.mr = null; return true; } toast('숫자로 적어 주세요'); return false; }
  if (k === 'q') { if (v <= 0) { toast('수량은 0보다 커야 해요'); return false; } it.q = v; }
  else if (k === 'mr') it.mr = v;
  else if (k === 'fix') it.fix = Math.round(v);
  else if (k === 'uc') { it.uc = v; it.mu = it.lu = it.eu = 0; }
  else { it[k] = v; it.uc = nz(it.mu) + nz(it.lu) + nz(it.eu); }
  if (it.src !== 'prod') it.ac = Math.round(it.uc * it.q);
  return true;
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.it) { const f = findIt(t.dataset.it); if (!f) return; const it = f[2], k = t.dataset.k; if (['n', 'sp', 'u', 'memo'].includes(k)) it[k] = t.value; else if (!setNum(it, k, t.value)) { render(); return; } save(); render(); return; }
  if (t.dataset.sn) { const s = PK.secs.find(x => x.id === t.dataset.sn); if (s) { s.n = t.value; save(); render(); } return; }
  if (t.dataset.sm) { const s = PK.secs.find(x => x.id === t.dataset.sm); const v = num(t.value); s.mr = v == null || Number.isNaN(v) ? null : v; save(); render(); return; }
  if (t.dataset.f) { const k = t.dataset.f; if (k === 'mAll') { const v = num(t.value); if (v == null || Number.isNaN(v)) { toast('숫자로 적어 주세요'); render(); return; } PK.mAll = v; } else if (k === 'vatIn') PK.vatIn = t.checked; else if (k === 'memo') PK.memo = t.value; else PK[k] = +t.value; save(); render(); }
  if (t.dataset.info) { PK.info[t.dataset.info] = t.value; save(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.ps !== undefined) { const L = t.parentElement.querySelector('.pl'), r = ourProducts(t.value); if (r == null) { L.hidden = false; L.innerHTML = '<div class="muted">🧾 상품 견적 탭에서 판매 데이터 · PMS를 먼저 올려 주세요</div>'; return; } L.hidden = !r.length; L.innerHTML = r.map(p => '<div data-pick="' + esc(JSON.stringify(p)) + '"><span>' + esc(p.n) + '</span><b>' + won(p.p) + '원</b></div>').join(''); }
});
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('cell') && e.target.classList.contains('r')) e.target.select(); });

let dd = 0; const hasF = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
addEventListener('dragenter', e => { if (!hasF(e)) return; e.preventDefault(); if (!dd++) { const o = document.createElement('div'); o.id = 'dov'; o.className = 'dropov'; o.innerHTML = '<div>📥 업체 견적서를 여기에 놓으세요</div>'; document.body.appendChild(o); } });
addEventListener('dragover', e => { if (hasF(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
