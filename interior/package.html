<script>
'use strict';
const BUILD = '2026-11-08p2';
(function () {
  const check = async () => { if (document.querySelector('.modal')) return; try { const t = await (await fetch(location.pathname + '?b=' + Date.now(), { cache: 'no-store' })).text(); const m = t.match(/const BUILD = '([^']+)'/); if (m && m[1] !== BUILD) location.reload(); } catch (e) { } };

const $ = id => document.getElementById(id);

const won = n => Math.round(n).toLocaleString('ko-KR');
const qf = n => Number.isInteger(n) ? n.toLocaleString('ko-KR') : n.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
let toastT = null; function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = 'none'; }, 2200); }
const LS = { get(k, d) { try { const v = localStorage.getItem('int.pkg.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('int.pkg.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } } };
const hn = v => String(v == null ? '' : v).replace(/\s+/g, '');
/* 숫자 읽기: 빈칸 → null, 못 읽으면 NaN (조용히 0으로 바꾸지 않음) */
function num(v) { if (typeof v === 'number') return Number.isFinite(v) ? v : NaN; const t = String(v == null ? '' : v).replace(/[,\s원₩]/g, ''); if (t === '' || t === '-') return null; const n = Number(t); return Number.isFinite(n) ? n : NaN; }
const nz = v => (v == null || Number.isNaN(v)) ? 0 : v;

let uid = Date.now() % 100000; const nid = () => 'i' + (++uid);

/* ===== 업체 견적서 읽기: 머리글(1줄 · 재료비/노무비 2줄) · 공종 제목 줄 · 소계 · 공과잡비/이윤/부가세 ===== */
const NAME_RE = /^(품명|품목|항목|내역|명칭|공사명|공사내용|작업내용|품명및규격|세부내역|내용)$/, SEC_RE = /^(공종|구분|공정|분류)$/;

function parseVendor(aoa) {
  let h = -1;
  for (let i = 0; i < Math.min(aoa.length, 40); i++) { const z = (aoa[i] || []).map(hn); if (z.some(x => NAME_RE.test(x) || SEC_RE.test(x)) && z.some(x => x === '수량' || /금액|합계/.test(x))) { h = i; break; } }
  if (h < 0) return { error: '표의 제목 줄(품명 · 수량 · 금액)을 찾지 못했어요.' };
  const top = (aoa[h] || []).map(hn), sub = (aoa[h + 1] || []).map(hn), two = sub.filter(x => /^(단가|금액)$/.test(x)).length >= 2;
  let carry = ''; const W = Math.max(top.length, sub.length);
  const lab = Array.from({ length: W }, (_, k) => { const t = top[k] || ''; if (t) carry = t; return two && sub[k] ? ((t || carry) + '|' + sub[k]) : t; });
  const at = re => lab.findIndex(x => re.test(x));
  let nc = lab.findIndex(x => NAME_RE.test(x)), sc = lab.findIndex(x => SEC_RE.test(x)); if (nc < 0) { nc = sc; sc = -1; }

  if (t.dataset.pt) { PQ[t.dataset.pt] = t.value; liveQ(); return; }
  if (t.dataset.pl) { const [a, id, k] = t.dataset.pl.split('.'), x = PQ[a].find(y => y.id === id); if (!x) return;
    if (k === 'q' || k === 'p') { const v = num(t.value); if (v == null || Number.isNaN(v)) { toast('숫자로 적어 주세요'); render(); return; } x[k] = k === 'p' ? Math.round(v) : v; saveQ(); render(); return; }
    x[k] = t.value; liveQ(); }
}, true);
addEventListener('resize', () => { if (MODE === 'pkg') fitQ(); });

/* ===================== 공통: 그리기 · 입력 ===================== */
function render() { if (MODE === 'pkg') { const sc = document.querySelector('#main .scroll'), y = sc ? sc.scrollTop : 0; renderP(); const s2 = document.querySelector('#main .scroll'); if (s2) s2.scrollTop = y; return; } const sc0 = document.querySelector('#main .scroll'), y = sc0 ? sc0.scrollTop : 0, x = sc0 ? sc0.scrollLeft : 0; renderA(); const sc = document.querySelector('#main .scroll'); if (sc) { sc.scrollTop = y; sc.scrollLeft = x; } }
const findIt = id => { for (const s of PK.secs) { const i = s.items.findIndex(x => x.id === id); if (i >= 0) return [s, i, s.items[i]]; } return null; };
document.addEventListener('click', e => {
  const t = e.target;
  const a = t.closest('[data-a]');
  if (a) { const k = a.dataset.a;
    if (k === 'vclear') { UNDO_V = JSON.parse(JSON.stringify(PK)); const keep = { mAll: PK.mAll, ru: PK.ru, rm: PK.rm, cut: PK.cut }; PK = Object.assign(newPK(), keep); save(); render(); toast('모두 지웠어요 — 실수였으면 ↩ 되돌리기'); return; }
    if (k === 'vundo') { if (UNDO_V) { PK = UNDO_V; UNDO_V = null; save(); render(); toast('되돌렸어요'); } return; }
    if (k === 'example') applyImport(parseVendor(exampleAoa()), '예시 (주)한빛인테리어');
    else if (k === 'exfile') downloadExample();
    else if (k === 'paste') { const tb = $('pasteBox'); if (!tb || !tb.value.trim()) toast('표를 붙여넣어 주세요'); else importPaste(tb.value); }
    else if (k === 'pv') previewModal(a.dataset.st);
    else if (k === 'print') printDoc(a.dataset.st);
    return; }
  const ma = t.closest('[data-mall]'); if (ma) { PK.mAll = +ma.dataset.mall; save(); render(); return; }
  const sm = t.closest('[data-secm]'); if (sm) { const s = PK.secs.find(x => x.id === sm.dataset.secm); s.mr = sm.dataset.m === '' ? null : +sm.dataset.m; save(); render(); return; }
  const dl = t.closest('[data-del]'); if (dl) { const f = findIt(dl.dataset.del); if (f) { f[0].items.splice(f[1], 1); PK.secs = PK.secs.filter(s => s.items.length || s.keep); save(); render(); } return; }
  const ai = t.closest('[data-addi]'); if (ai) { const s = PK.secs.find(x => x.id === ai.dataset.addi); s.items.push({ id: nid(), n: '새 항목', sp: '', u: '식', q: 1, mu: 0, lu: 0, eu: 0, uc: 0, ac: 0, memo: '', mr: null, src: 'add' }); save(); render(); toast('줄을 추가했어요 — 이름 · 원가 단가를 적어 주세요'); return; }
  if (t.closest('[data-adds]')) { PK.secs.push({ id: nid(), n: '추가 공종', mr: null, items: [{ id: nid(), n: '새 항목', sp: '', u: '식', q: 1, mu: 0, lu: 0, eu: 0, uc: 0, ac: 0, memo: '', mr: null, src: 'add' }] }); save(); render(); return; }
  const pk = t.closest('[data-pick]'); if (pk) { const p = JSON.parse(pk.dataset.pick); let s = PK.secs.find(x => x.n === '추가 상품 (매장)'); if (!s) PK.secs.push(s = { id: nid(), n: '추가 상품 (매장)', mr: null, items: [] }); s.items.push({ id: nid(), n: p.n, sp: p.c, u: '개', q: 1, mu: 0, lu: 0, eu: 0, uc: 0, ac: 0, memo: '', mr: null, src: 'prod', fix: p.p, bc: p.b }); save(); render(); toast(p.n + ' 넣었어요 (매장 판매가 ' + won(p.p) + '원)'); return; }
});
function setNum(it, k, raw) {
  const v = num(raw); if (v == null || Number.isNaN(v)) { if (k === 'mr') { it.mr = null; return true; } if (k === 'so') { it.so = null; return true; } toast('숫자로 적어 주세요'); return false; }
  if (k === 'so') { it.so = Math.round(v); return true; }
  if (k === 'q') { if (v <= 0) { toast('수량은 0보다 커야 해요'); return false; } it.q = v; }
  else if (k === 'mr') it.mr = v;
  else if (k === 'fix') it.fix = Math.round(v);
  else if (k === 'uc') { it.uc = v; it.mu = it.lu = it.eu = 0; }
  else { it[k] = v; it.uc = nz(it.mu) + nz(it.lu) + nz(it.eu); }
  if (it.src !== 'prod') it.ac = Math.round(it.uc * it.q);
  return true;
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.it) { const f = findIt(t.dataset.it); if (!f) return; const it = f[2], k = t.dataset.k; if (['n', 'sp', 'u', 'memo'].includes(k)) it[k] = t.value; else if (!setNum(it, k, t.value)) { render(); return; } save(); render(); return; }
  if (t.dataset.sn) { const s = PK.secs.find(x => x.id === t.dataset.sn); if (s) { s.n = t.value; save(); render(); } return; }
  if (t.dataset.sm) { const s = PK.secs.find(x => x.id === t.dataset.sm); const v = num(t.value); s.mr = v == null || Number.isNaN(v) ? null : v; save(); render(); return; }
  if (t.dataset.f) { const k = t.dataset.f; if (k === 'mAll') { const v = num(t.value); if (v == null || Number.isNaN(v)) { toast('숫자로 적어 주세요'); render(); return; } PK.mAll = v; } else if (k === 'vatIn') PK.vatIn = t.checked; else if (k === 'memo') PK.memo = t.value; else if (k === 'rm') PK.rm = t.value; else if (k === 'showSum') PK.showSum = t.checked; else PK[k] = +t.value; save(); render(); }
  if (t.dataset.info) { PK.info[t.dataset.info] = t.value; save(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.ps !== undefined) { const L = t.parentElement.querySelector('.pl'), r = ourProducts(t.value); if (r == null) { L.hidden = false; L.innerHTML = '<div class="muted">🧾 상품 견적 탭에서 판매 데이터 · PMS를 먼저 올려 주세요</div>'; return; } L.hidden = !r.length; L.innerHTML = r.map(p => '<div data-pick="' + esc(JSON.stringify(p)) + '"><span>' + esc(p.n) + '</span><b>' + won(p.p) + '원</b></div>').join(''); }
});
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('cell') && e.target.classList.contains('r')) e.target.select(); });
$('fImp').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; importFiles(fs); });
let dd = 0; const hasF = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
addEventListener('dragenter', e => { if (!hasF(e)) return; e.preventDefault(); if (!dd++) { const o = document.createElement('div'); o.id = 'dov'; o.className = 'dropov'; o.innerHTML = '<div>📥 업체 견적서를 여기에 놓으세요</div>'; document.body.appendChild(o); } });
addEventListener('dragover', e => { if (hasF(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
addEventListener('dragleave', e => { if (!hasF(e)) return; if (!--dd && $('dov')) $('dov').remove(); });
addEventListener('drop', e => { if (!hasF(e)) return; e.preventDefault(); dd = 0; if ($('dov')) $('dov').remove(); importFiles([...e.dataTransfer.files]); });
render();
