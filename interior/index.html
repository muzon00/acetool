<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>인테리어 상담 견적 · ACE</title>
<meta name="theme-color" content="#1d3557">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root { --bg: #eef1f5; --surface: #fff; --surface2: #f6f8fb; --line: #dfe4ec; --ink: #172033; --ink2: #4d586b; --ink3: #8a94a6; --navy: #1d3557; --red: #d71920; --ok: #1f7a4d; --warn: #b26a00; --r: 14px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { height: 100dvh; display: flex; flex-direction: column; }
/* 맨 위: 시안 고르기 */
.top { background: var(--navy); color: #fff; padding: 8px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex: none; }
.top h1 { font-size: 1.05em; margin: 0; white-space: nowrap; } .top h1 b { color: #ff6b6b; }
.vtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.vtabs button { border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; border-radius: 10px; padding: 7px 12px; font-weight: 700; min-height: 40px; }
.vtabs button small { display: block; font-weight: 500; opacity: .75; font-size: .76em; }
.vtabs button.on { background: #fff; color: var(--navy); }
.top .note { font-size: .78em; opacity: .8; }
.top .btn { color: var(--navy); }
/* 반으로 나누기: 왼쪽 견적서 · 오른쪽 상품 */
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: 58fr 42fr; }
.split.b { grid-template-columns: 50fr 50fr; }
.pane { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.pane.left { border-right: 1px solid var(--line); }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; flex: 1; }
.bar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; flex: none; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 14px; min-height: 44px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.btn.pri { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 0 10px; font-size: .9em; }
.btn:disabled { opacity: .45; }
.muted { color: var(--ink3); }
/* 상품 카드 (오른쪽) — 왼쪽으로 끌거나 누르면 담김 */
.search { flex: 1; min-width: 140px; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--surface2); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; scrollbar-width: none; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 14px; min-height: 38px; font-weight: 600; color: var(--ink2); }
.chips button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; padding: 12px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 6px; touch-action: pan-y; user-select: none; -webkit-user-select: none; position: relative; transition: transform .1s, box-shadow .1s; }
.pcard:active { transform: scale(.98); }
.pcard .ic { height: 70px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 34px; }
.pcard .nm { font-weight: 700; font-size: .93em; line-height: 1.3; }
.pcard .sp { font-size: .8em; color: var(--ink3); }
.pcard .pr { font-weight: 800; }
.pcard .add { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--navy); color: #fff; font-size: 20px; line-height: 1; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.pcard .grip { font-size: .72em; color: var(--ink3); }
.pcard.in { border-color: #9fc7b0; box-shadow: inset 0 0 0 2px #cfe8da; }
.pcard .cnt { position: absolute; left: 8px; top: 8px; background: var(--ok); color: #fff; border-radius: 999px; font-size: .75em; font-weight: 800; padding: 2px 8px; }
/* 끌기 */
.dragghost { position: fixed; z-index: 100; pointer-events: none; background: var(--navy); color: #fff; border-radius: 12px; padding: 10px 14px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.3); transform: translate(-50%, -60%) rotate(-3deg); max-width: 260px; }
body.dragging [data-drop] { outline: 3px dashed #6c9bd2; outline-offset: -6px; }
body.dragging [data-drop].over { outline-color: var(--ok); background-color: #eaf7ef !important; }
.flash { animation: fl 1s ease; } @keyframes fl { 0% { background: #fff3b0; } 100% { background: transparent; } }
/* 바코드 */
svg.bc { display: block; width: 100%; height: auto; background: #fff; }
.qtyb { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.qtyb button { width: 36px; height: 36px; border: 0; background: var(--surface2); font-size: 18px; font-weight: 700; }
.qtyb input { width: 44px; height: 36px; border: 0; text-align: center; font-weight: 800; -moz-appearance: textfield; }
.qtyb input::-webkit-outer-spin-button, .qtyb input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.del { border: 0; background: transparent; color: var(--ink3); font-size: 18px; width: 36px; height: 36px; border-radius: 8px; }
.empty { margin: 16px; border: 2px dashed var(--line); border-radius: var(--r); padding: 40px 16px; text-align: center; color: var(--ink3); line-height: 1.7; }
.empty b { color: var(--ink2); font-size: 1.05em; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #172033; color: #fff; padding: 10px 18px; border-radius: 12px; z-index: 300; font-weight: 600; display: none; max-width: 90vw; }

/* ========== 시안 A: 견적서 종이 그대로 ========== */
.paperwrap { background: #d9dee6; padding: 16px; }
.paper { background: #fff; max-width: 860px; margin: 0 auto; padding: 22px 18px 18px; box-shadow: 0 4px 20px rgba(0,0,0,.12); border-radius: 4px; min-height: 100%; }
.ph { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 14px; }
.ph .lg { font-weight: 900; font-style: italic; color: var(--red); font-size: 1.15em; } .ph .lg i { color: var(--ink); }
.ph h2 { margin: 0; letter-spacing: .5em; font-size: 1.6em; text-align: center; }
.ph .no { text-align: right; font-size: .8em; color: var(--ink3); }
.pinfo { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid #000; margin-bottom: 12px; }
.pinfo label { display: flex; align-items: center; border-bottom: 1px solid #c8ced8; min-height: 38px; }
.pinfo label:nth-child(odd) { border-right: 1px solid #c8ced8; }
.pinfo label span { width: 72px; flex: none; text-align: center; background: #f2f4f7; align-self: stretch; display: flex; align-items: center; justify-content: center; font-size: .85em; font-weight: 700; }
.pinfo input { border: 0; padding: 0 8px; min-height: 38px; flex: 1; min-width: 0; background: transparent; }
table.qt { width: 100%; border-collapse: collapse; font-size: .9em; }
table.qt th { background: #f2f4f7; border-top: 1.5px solid #000; border-bottom: 1px solid #000; padding: 6px 4px; font-size: .85em; }
table.qt td { border-bottom: 1px solid #e3e7ee; padding: 6px 4px; vertical-align: middle; }
table.qt td.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.qt td.c { text-align: center; }
table.qt .nm b { display: block; font-size: .92em; line-height: 1.3; word-break: keep-all; overflow-wrap: anywhere; } table.qt .nm small { color: var(--ink3); font-size: .78em; }
table.qt .qtyb button { width: 30px; height: 34px; } table.qt .qtyb input { width: 36px; height: 34px; }
table.qt td.bcc { width: 108px; min-width: 108px; } table.qt td.bcc svg { min-width: 104px; } table.qt th:nth-child(2) { min-width: 110px; }
.ptot { margin-top: 10px; border-top: 1.5px solid #000; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 10px 4px; font-variant-numeric: tabular-nums; }
.ptot .g { font-size: 1.25em; font-weight: 900; } .ptot .g + div { font-size: 1.25em; font-weight: 900; color: var(--red); }
.pmemo { width: 100%; border: 1px solid #c8ced8; border-radius: 6px; padding: 8px; min-height: 54px; resize: vertical; margin-top: 6px; }
.pdrop { min-height: 120px; }
/* ===== 실제 상품 · 자주 사는 구성 · 같이 산 상품 · 올리기 ===== */
.pcard .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.badge { display: inline-block; font-size: .7em; font-weight: 800; border-radius: 6px; padding: 1px 6px; margin-right: 4px; vertical-align: middle; }
.badge.hot { background: #ffe8e8; color: var(--red); } .badge.stop { background: #eee; color: #777; } .badge.low { background: #fff3d6; color: var(--warn); }
.info-strip { padding: 8px 12px; background: #fff8e6; color: #7a5200; font-size: .85em; border-bottom: 1px solid #f3e2b8; flex: none; }
.bundles { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; scrollbar-width: none; }
.bundles button { flex: none; border: 1.5px solid #9fb8d6; background: #f3f7fc; border-radius: 14px; padding: 8px 14px; text-align: left; font-weight: 800; min-height: 56px; color: var(--navy); }
.bundles button small { display: block; font-weight: 500; color: var(--ink3); font-size: .74em; }
.co { padding: 10px 12px; background: #eef8f2; border-bottom: 1px solid #cfe8da; flex: none; }
.co .ch { display: flex; align-items: center; gap: 8px; font-size: .85em; font-weight: 700; color: var(--ok); margin-bottom: 6px; }
.co .ch button { margin-left: auto; border: 0; background: transparent; font-size: 18px; color: var(--ink3); }
.co .cl { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.co .ci { flex: none; width: 190px; background: #fff; border: 1px solid #cfe8da; border-radius: 12px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.co .ci b { font-size: .82em; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.co .ci small { color: var(--ink3); font-size: .74em; grid-column: 1; }
.co .ci button { grid-row: 1 / span 2; grid-column: 2; width: 38px; height: 38px; border-radius: 10px; border: 0; background: var(--ok); color: #fff; font-size: 20px; }
.modal { position: fixed; inset: 0; z-index: 180; background: rgba(15,23,42,.5); display: flex; align-items: flex-start; justify-content: center; padding: 16px; overflow-y: auto; }
.mbox { background: var(--surface); border-radius: 18px; width: min(720px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.35); overflow: hidden; }
.mh { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.mh b { font-size: 1.1em; } .mh .x { margin-left: auto; }
.mb { padding: 14px 16px; } .mf { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.drop { border: 2px dashed #9fb8d6; border-radius: 14px; padding: 18px; text-align: center; background: #f6f9fd; display: block; cursor: pointer; }
.drop b { display: block; font-size: 1.05em; margin-bottom: 4px; }
.dropov { position: fixed; inset: 0; z-index: 400; background: rgba(29,53,87,.78); display: flex; align-items: center; justify-content: center; pointer-events: none; }
.dropov div { border: 4px dashed #fff; border-radius: 24px; padding: 40px 56px; color: #fff; font-size: 1.6em; font-weight: 900; text-align: center; }
.dropov small { display: block; font-size: .5em; font-weight: 600; opacity: .85; margin-top: 8px; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 10px; font-size: .92em; margin: 10px 0; } .kv span:nth-child(odd) { color: var(--ink3); }
.ok { background: #eaf7ef; color: #14532d; border-radius: 10px; padding: 10px 12px; } .err { background: #fdecee; color: #8a1c24; border-radius: 10px; padding: 10px 12px; } .warnb { background: #fff6e0; color: #6b4300; border-radius: 10px; padding: 10px 12px; }
.bsec { margin: 12px 0 4px; font-weight: 800; font-size: .92em; color: var(--ink2); }
.bsec small { font-weight: 500; color: var(--ink3); }
.bi { display: grid; grid-template-columns: 30px 1fr auto 92px; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid #f0f2f6; }
.bi input[type=checkbox] { width: 24px; height: 24px; }
.bi .nm { font-size: .92em; } .bi .nm small { display: block; color: var(--ink3); font-size: .8em; }
.bi .pr { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.share { display: inline-block; height: 6px; border-radius: 3px; background: #9fc7b0; vertical-align: middle; margin-right: 4px; }
.pr-in { width: 78px; text-align: right; border: 1px solid var(--line); border-radius: 8px; min-height: 34px; padding: 0 6px; font-variant-numeric: tabular-nums; }
.pr-in.chg { color: var(--red); font-weight: 700; }
/* ========== 결제 스캔 화면 (세 시안 공통) ========== */
.scan { position: fixed; inset: 0; z-index: 200; background: #fff; display: flex; flex-direction: column; }
.scan .sh { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.scan .sh b { font-size: 1.1em; }
.scan .prog { height: 6px; background: #edf0f4; flex: none; } .scan .prog i { display: block; height: 100%; background: var(--ok); transition: width .2s; }
.scan .sb { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 14px; text-align: center; }
.scan .big { width: min(640px, 92vw); padding: 10px 26px; background: #fff; }
.scan .nm { font-size: 1.35em; font-weight: 800; } .scan .nm small { display: block; font-size: .7em; color: var(--ink3); font-weight: 500; }
.scan .qn { font-size: 1.15em; background: #fff6e0; color: #6b4300; border-radius: 12px; padding: 10px 16px; } .scan .qn b { font-size: 1.5em; }
.scan .sf { display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.scan .sf .btn { flex: 1; justify-content: center; min-height: 60px; font-size: 1.1em; }
.scan .tip { font-size: .8em; color: var(--ink3); }
.scan .alll { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; text-align: left; }
.scan .alll > div { border: 1px solid var(--line); border-radius: 12px; padding: 10px; } .scan .alll > div.ok { opacity: .45; }
.scan .alll b { display: block; } .scan .alll small { color: var(--ink3); }
/* 세로 화면 · 작은 태블릿: 상품은 아래에서 올라오는 판 */
.fabcat { display: none; }
@media (max-width: 899px) {
  .split, .split.b { grid-template-columns: 1fr; }
  .pane.right { position: fixed; left: 0; right: 0; bottom: 0; height: 74dvh; z-index: 50; background: var(--bg); border-top-left-radius: 18px; border-top-right-radius: 18px; box-shadow: 0 -10px 40px rgba(0,0,0,.25); transform: translateY(105%); transition: transform .25s; overflow: hidden; }
  .pane.right.open { transform: none; }
  .fabcat { display: flex; position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 60; min-height: 56px; border-radius: 999px; padding: 0 20px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .top .note { display: none; }
  table.qt td.bcc { width: 96px; }
}
/* 인쇄: 왼쪽 견적서만 (바코드 포함) */
@media print {
  @page { size: A4; margin: 10mm; }
  body { overflow: visible; background: #fff; }
  .top, .pane.right, .bar, .fabcat, .toast, .bfoot .btn, .tgtbar, .del, .qtyb button, .noprint { display: none !important; }
  .app, .split, .pane, .scroll { display: block !important; height: auto !important; overflow: visible !important; }
  .pane.left { border: 0; }
  .paperwrap { background: #fff; padding: 0; } .paper { box-shadow: none; max-width: none; padding: 0; }
  .qtyb { border: 0; } .qtyb input { width: auto; }
  
  .pinfo input { border: 0; background: transparent; } .pr-in { border: 0 !important; background: transparent !important; }
}
</style>
</head>
<body>
<style>
.closecat { display: none; }
@media (max-width: 899px) { .closecat { display: inline-flex; } }
</style>
<div class="app">
  <div class="top">
    <h1>인테리어 상담 견적</h1>
    <span class="note" id="dbNote"></span>
    <button class="btn sm" type="button" data-act="upload" style="margin-left:auto">📥 상품 · 판매 데이터 올리기</button>
  </div>
  <div class="split" id="split">
    <section class="pane left">
      <div class="bar"><b>견적서</b><span class="muted" id="cnt"></span><span style="margin-left:auto"></span>
        <button class="btn pri" type="button" data-act="scan">🧾 결제 바코드</button><button class="btn" type="button" data-act="print">🖨 인쇄</button><button class="btn ghost" type="button" data-act="clear">🗑 비우기</button></div>
      <div class="scroll paperwrap" data-drop="main"><div class="paper" id="L"></div></div>
    </section>
    <section class="pane right" id="Rp">
      <div class="bar"><input class="search" id="q" type="search" placeholder="상품명 · 상품코드 · 바코드 찾기"><button class="btn ghost closecat" type="button" data-act="closecat">닫기 ✕</button></div>
      <div id="info"></div>
      <div class="bundles" id="BND"></div>
      <div id="CO"></div>
      <div class="chips" id="chips"></div>
      <div class="scroll" id="Rs"><div class="pgrid" id="R"></div></div>
    </section>
  </div>
</div>
<button class="btn pri fabcat" id="fabcat" type="button">＋ 상품 담기</button>
<input type="file" id="fSales" accept=".xlsx,.xlsm,.xlsb,.xls,.csv,.json" multiple hidden>
<input type="file" id="fStock" accept=".xlsx,.xlsm,.xlsb,.xls,.csv" multiple hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const BUILD = '2026-11-08e';
/* 새 버전이 올라오면 저절로 새로 고침 (창으로 돌아올 때 · 5분마다). 고르는 창이나 스캔 화면을 쓰는 중이면 기다림 */
(function () {
  const check = async () => {
    if (document.querySelector('.modal, .scan')) return;
    try { const t = await (await fetch(location.pathname + '?b=' + Date.now(), { cache: 'no-store' })).text(); const m = t.match(/const BUILD = '([^']+)'/); if (m && m[1] !== BUILD) location.reload(); } catch (e) { }
  };
  addEventListener('focus', check); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); }); setInterval(check, 5 * 60 * 1000);
})();
/* ===== 바코드 (EAN-13 · Code128) — 외부 도구 없이 SVG로 그림 ===== */
const BC = (() => {
  const C128 = '212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232'.split(' ');

  el.innerHTML = '<div class="sh"><b>🧾 결제 스캔</b><span>' + (SC.all ? '한 화면에 모두' : Math.min(i + 1, n) + ' / ' + n) + '</span><span class="muted">' + tn + '개 · ' + won(tt) + '원</span><span style="margin-left:auto"></span><button class="btn sm" type="button" data-s="all">' + (SC.all ? '하나씩 크게' : '한 화면에 모두') + '</button><button class="btn sm" type="button" data-s="close">닫기 ✕</button></div>' +
    '<div class="prog"><i style="width:' + pct + '%"></i></div><div class="sb">' + body + '</div>' +
    (SC.all ? '' : (i >= n ? '<div class="sf"><button class="btn" type="button" data-s="prev">◀ 다시 보기</button><button class="btn pri" type="button" data-s="close">끝내기</button></div>' : '<div class="sf"><button class="btn" type="button" data-s="prev"' + (i ? '' : ' disabled') + '>◀ 이전</button><button class="btn pri" type="button" data-s="next">✔ 찍었어요 · 다음 ▶</button></div>'));
}
document.addEventListener('click', e => {
  if (!SC) return; const b = e.target.closest('.scan [data-s]'), sk = e.target.closest('[data-sk]');
  if (sk) { const k = +sk.dataset.sk; SC.done.has(k) ? SC.done.delete(k) : SC.done.add(k); drawScan(); return; }
  if (!b) return; const s = b.dataset.s;
  if (s === 'close') { $('scan').remove(); SC = null; return; }
  if (s === 'all') SC.all = !SC.all;
  if (s === 'next') { SC.done.add(SC.i); SC.i = Math.min(SC.i + 1, SC.ls.length); }
  if (s === 'prev') SC.i = Math.max(0, Math.min(SC.i, SC.ls.length) - 1);
  drawScan();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const m = document.querySelector('.modal'); if (m) { m.remove(); return; } if (SC) { $('scan').remove(); SC = null; } return; }
  if (!SC || SC.all) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); SC.done.add(SC.i); SC.i = Math.min(SC.i + 1, SC.ls.length); drawScan(); }
  else if (e.key === 'ArrowLeft') { SC.i = Math.max(0, Math.min(SC.i, SC.ls.length) - 1); drawScan(); }
});
renderLeft(); renderRight();
</script>
</body>
</html>
