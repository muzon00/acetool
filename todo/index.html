<script>
// 새 버전 자동 반영 (고칠 때마다 BUILD 값을 바꿔 주세요)
const BUILD = '2026-11-02g';
(function () {
  let busy = false;
  async function check() {
    if (busy || document.visibilityState !== 'visible' || (document.activeElement && /^(INPUT|SELECT)$/.test(document.activeElement.tagName))) return;
    busy = true;
    try {
      const t = await (await fetch(location.pathname + '?b=' + Date.now(), { cache: 'no-store' })).text();
      const m = t.match(/const BUILD = '([^']+)'/);
      if (m && m[1] !== BUILD && sessionStorage.getItem('todo.reloadTo') !== m[1]) { sessionStorage.setItem('todo.reloadTo', m[1]); location.replace(location.pathname + '?v=' + m[1]); }
    } catch (e) { }
    busy = false;
  }
  check(); document.addEventListener('visibilitychange', check); setInterval(check, 30 * 60 * 1000);
})();
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, deleteDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// 매출 현황·근무표와 같은 Firebase 프로젝트 (이 페이지는 할 일 · 전달 사항 · 근무표 명단만 읽음, 매출 자료는 읽지 않음)
const app = initializeApp({
  apiKey: 'AIzaSyCIL_n5H8sYTEWb4jhISM5yS_6y_ci5Rnk',
  authDomain: 'acetool-923f6.firebaseapp.com',
  projectId: 'acetool-923f6',
  storageBucket: 'acetool-923f6.firebasestorage.app',
  messagingSenderId: '961124023870',
  appId: '1:961124023870:web:8753a14fa706f34255db6f'
}, 'todo');
const db = getFirestore(app);
/* 저장 구조
   pos_todo/{id}   → { who: 직원id|'all', t, kind: day|week|month|always, s: YYYYMMDD, e, done: { 기간키: true }, at, by, src? }
                     src: 'staff' = 직원이 이 페이지에서 쓴 할 일 (직원이 고치고 지울 수 있음). 없으면 관리자가 쓴 할 일 (체크만)
   team_notice/{id} → { t, d: YYYYMMDD 또는 0(날짜 없는 공지), at, by }  — 관리자가 매출 현황 TO DO에서 씀
   sch_settings/roster, sch_schedule/{YYYY-MM-DD} → 근무표 명단·근무 */
const KINDS = { day: '오늘', week: '이번 주', month: '이번 달', always: '매일' };
const OFF = ['휴무', '연차', '경조', '예비군', '시험', '교육', '육아휴직'];
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clean = (v, n) => String(v == null ? '' : v).replace(/[\u0000-\u001f]/g, ' ').trim().slice(0, n || 60);
const pad = n => String(n).padStart(2, '0');
function todayInt() { return Number(new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).replace(/-/g, '')); }
const dowOf = d => new Date(Date.UTC(Math.floor(d / 10000), Math.floor(d / 100) % 100 - 1, d % 100)).getUTCDay();
const addDays = (d, k) => { const t = new Date(Date.UTC(Math.floor(d / 10000), Math.floor(d / 100) % 100 - 1, d % 100 + k)); return t.getUTCFullYear() * 10000 + (t.getUTCMonth() + 1) * 100 + t.getUTCDate(); };
const md = d => (Math.floor(d / 100) % 100) + '/' + (d % 100);
const dash = d => Math.floor(d / 10000) + '-' + pad(Math.floor(d / 100) % 100) + '-' + pad(d % 100);
const daysBetween = (a, b) => Math.round((Date.UTC(Math.floor(b / 10000), Math.floor(b / 100) % 100 - 1, b % 100) - Date.UTC(Math.floor(a / 10000), Math.floor(a / 100) % 100 - 1, a % 100)) / 86400000);
const mon = d => addDays(d, -((dowOf(d) + 6) % 7));
// 매출 현황 TO DO와 같은 규칙: 보이는 날 · 체크 기간 키
const keyOf = (t, d) => t.kind === 'week' ? 'w' + mon(d) : t.kind === 'month' ? 'm' + Math.floor(d / 100) : t.kind === 'always' ? 'd' + d : 'd' + t.s;
function shows(t, d) {
  if (t.kind === 'day') return t.s === d || (d === todayInt() && t.s < d && t.s >= addDays(d, -14) && !(t.done || {})['d' + t.s]);
  if (t.kind === 'week') return mon(t.s) === mon(d);
  if (t.kind === 'month') return Math.floor(t.s / 100) === Math.floor(d / 100);
  return t.s <= d && (!t.e || d <= t.e);
}
let toastT = null;
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = 'none'; }, 3000); }
const errMsg = e => ((e && e.code) || '').includes('permission-denied') ? '서버에서 막혔어요 — 매니저가 쓴 할 일은 체크만 할 수 있고, 그 밖이면 서버 설정(규칙)이 아직 반영되지 않은 거예요. 매니저에게 알려 주세요' : ((e && e.code) || '').includes('unavailable') ? '인터넷 연결을 확인해 주세요' : (e && e.message) || String(e);

const S = { date: todayInt(), roster: [], sched: {}, tasks: [], notices: [], me: '', unsubDay: null };
try { S.me = localStorage.getItem('todo.me') || ''; } catch (e) { }
const tName = m => m.name + (m.title ? ' ' + m.title : '');

// 실시간: 할 일 · 전달 사항 · 명단 (날짜를 바꾸면 그날 근무표만 다시 구독)
onSnapshot(collection(db, 'pos_todo'), s => { S.tasks = []; s.forEach(x => S.tasks.push(Object.assign({ id: x.id }, x.data()))); render(); }, e => { $('people').innerHTML = '<div class="card">' + esc(errMsg(e)) + '</div>'; });
onSnapshot(collection(db, 'team_notice'), s => { S.notices = []; s.forEach(x => S.notices.push(Object.assign({ id: x.id }, x.data()))); render(); }, e => { $('notices').innerHTML = '<p class="muted">' + esc(errMsg(e)) + '</p>'; });
onSnapshot(doc(db, 'sch_settings', 'roster'), s => { S.roster = s.exists() ? (s.data().members || []) : []; fillMe(); render(); });
function watchDay() {
  if (S.unsubDay) S.unsubDay();
  const ds = dash(S.date);
  S.unsubDay = onSnapshot(doc(db, 'sch_schedule', ds), s => { S.sched[ds] = s.exists() ? s.data() : {}; render(); });
}
watchDay();

function fillMe() {
  const staff = S.roster.filter(m => m.group !== '캐셔' && m.name);
  $('meSel').innerHTML = '<option value="">내 이름 고르기</option>' + staff.map(m => '<option value="' + esc(m.id) + '"' + (m.id === S.me ? ' selected' : '') + '>' + esc(tName(m)) + '</option>').join('');
}
$('meSel').addEventListener('change', e => { S.me = e.target.value; try { S.me ? localStorage.setItem('todo.me', S.me) : localStorage.removeItem('todo.me'); } catch (x) { } render(); });
$('prev').addEventListener('click', () => { S.date = addDays(S.date, -1); watchDay(); render(); });
$('next').addEventListener('click', () => { S.date = addDays(S.date, 1); watchDay(); render(); });
$('today').addEventListener('click', () => { S.date = todayInt(); watchDay(); render(); });

// 입력 중에 다른 사람 변경으로 화면을 다시 그리면 쓰던 글자가 사라지므로, 입력 칸에 글자가 있으면 다 쓸 때까지 미룸
function busyTyping() { const a = document.activeElement; return a && a.tagName === 'INPUT' && a.type === 'text' && a.closest('#people') && a.value.trim(); }  // 전달 사항 입력 칸은 다시 그리는 곳 밖이라 해당 없음
document.addEventListener('focusout', () => setTimeout(() => { if (S.pending && !busyTyping()) render(true); }, 0));
// 산길 위 내 위치: 진행률만큼 길을 칠하고 점을 옮김 (다 하면 정상 깃발)
function climb(r) {
  const tr = $('trail'), dn = $('trailDone'), c = $('climber'); if (!tr || !tr.getTotalLength) return;
  const L = tr.getTotalLength(), pt = tr.getPointAtLength(L * Math.max(0, Math.min(1, r)));
  dn.style.strokeDasharray = L; dn.style.strokeDashoffset = L * (1 - Math.max(0, Math.min(1, r)));
  c.setAttribute('cx', pt.x.toFixed(1)); c.setAttribute('cy', pt.y.toFixed(1));
}
function render(force) {
  if (!force && busyTyping()) { S.pending = true; return; }
  S.pending = false;
  const d = S.date, ds = dash(d), sc = S.sched[ds] || {}, today = todayInt();
  const staff = S.roster.filter(m => m.group !== '캐셔' && m.name && (!m.start || m.start <= ds) && (!m.end || m.end >= ds));
  const st = m => sc[m.id] || '', hrs = s => s === '조출' ? '조출 07~17' : (s === '마감' || !s) ? '10~20' : s;
  const on = staff.filter(m => !OFF.includes(st(m))), off = staff.filter(m => OFF.includes(st(m)));
  const vis = S.tasks.filter(t => shows(t, d));
  const list = who => vis.filter(t => t.who === who).sort((a, b) => ['day', 'week', 'month', 'always'].indexOf(a.kind) - ['day', 'week', 'month', 'always'].indexOf(b.kind) || (a.s - b.s));
  const doneOf = t => !!(t.done || {})[keyOf(t, d)];
  // 위쪽 인사
  const me = S.roster.find(m => m.id === S.me), mine = me ? list(me.id).concat(list('all')) : vis, md2 = mine.filter(doneOf).length;
  $('dateTxt').textContent = md(d) + ' (' + DOW[dowOf(d)] + ')' + (d === today ? ' · 오늘' : '');
  const left = mine.length - md2, ratio = mine.length ? md2 / mine.length : 0;
  $('hello').innerHTML = !mine.length ? '오늘은 할 일이 없어요' : left ? '정상까지 <em>' + left + '개</em> 남았어요' : '정상 도착! <em>다 했어요</em>';
  $('helloSub').textContent = (me ? tName(me) + '님 · ' : '매장 전체 · ') + '할 일 ' + mine.length + '개 중 ' + md2 + '개 완료 · ' + Math.round(ratio * 100) + '%' + (me ? '' : ' · 위에서 내 이름을 고르세요');
  climb(ratio);
  // 일정 · 전달 사항: 날짜 없는 공지 + 오늘 이후 일정 (지난 일정은 숨김)
  const nts = S.notices.filter(n => !n.d || n.d >= d).sort((a, b) => (a.d || 0) - (b.d || 0) || String(a.id).localeCompare(String(b.id)));
  $('ntCnt').textContent = nts.length ? nts.length + '개' : '';
  $('notices').innerHTML = nts.length ? nts.map(n => {
    const left = n.d ? daysBetween(d, n.d) : null;
    return '<div class="nt' + (n.d === d ? ' today' : '') + '"><span class="d">' + (n.d ? md(n.d) + ' (' + DOW[dowOf(n.d)] + ')<small>' + (left === 0 ? '오늘' : 'D-' + left) + '</small>' : '🔁 계속') + '</span><span class="t">' + esc(n.t) + (n.by ? '<span class="by">' + esc(String(n.by).split('@')[0]) + '</span>' : '') + '</span><button type="button" class="x" data-ntdel="' + esc(n.id) + '" aria-label="지우기">✕</button></div>';
  }).join('') : '<p class="muted" style="margin:0">전달 사항이 없어요.</p>';
  $('whoLine').innerHTML = on.map(m => '<span><b>' + esc(tName(m)) + '</b> ' + esc(hrs(st(m))) + '</span>').join('') + off.map(m => '<span class="off">' + esc(tName(m)) + ' · ' + esc(st(m)) + '</span>').join('') || '<span class="muted">근무표를 불러오는 중…</span>';
  // 사람별 칸: 모두 함께 → 내 칸 → 출근자 → 쉬는 사람
  const order = [{ id: 'all', title: '모두 함께', sub: '' }];
  const add = (m, offTxt) => order.push({ id: m.id, title: tName(m), sub: offTxt || hrs(st(m)), off: !!offTxt });
  if (me) add(me, OFF.includes(st(me)) ? st(me) : '');
  on.filter(m => !me || m.id !== me.id).forEach(m => add(m));
  off.filter(m => !me || m.id !== me.id).forEach(m => add(m, st(m)));
  $('people').innerHTML = '<div class="people">' + order.map(p => {
    const ts = list(p.id), n = ts.filter(doneOf).length, isMe = me && p.id === me.id;
    return '<div class="card' + (isMe ? ' me' : '') + (p.off ? ' off' : '') + '" data-who="' + esc(p.id) + '"><h2>' + esc(p.title) + (p.sub ? ' <span class="tag' + (p.off ? ' gray' : '') + '">' + esc(p.sub) + '</span>' : '') + (isMe ? ' <span class="tag">나</span>' : '') + '<span class="cnt">' + (ts.length ? n + ' / ' + ts.length : '') + '</span></h2>' +
      (ts.length ? '<div class="pbar"><i style="width:' + (n / ts.length * 100).toFixed(1) + '%"></i></div>' : '') +
      (ts.length ? ts.map(t => {
        const dn = doneOf(t), mineT = t.src === 'staff', late = t.kind === 'day' && t.s < d;
        return '<div class="li' + (dn ? ' done' : '') + '" data-id="' + esc(t.id) + '"><input type="checkbox"' + (dn ? ' checked' : '') + ' aria-label="다 했음">' +
          (mineT ? '<button type="button" class="t" data-edit title="눌러서 고치기">' + esc(t.t) + '</button>' : '<span class="t">' + esc(t.t) + '</span>') +
          '<span class="tag ' + (late ? 'late' : 'gray') + '">' + (late ? md(t.s) + '부터' : KINDS[t.kind]) + '</span>' +
          (mineT ? '<button type="button" class="x" data-del aria-label="지우기">✕</button>' : '') + '</div>';
      }).join('') : '<p class="muted" style="margin:2px 0">할 일이 없어요</p>') +
      '<div class="add"><input type="text" maxlength="60" placeholder="+ ' + (p.id === 'all' ? '모두 함께 할 일' : esc(p.title.split(' ')[0]) + ' 할 일') + ' 추가" aria-label="할 일 추가"><select aria-label="기간">' + Object.keys(KINDS).map(k => '<option value="' + k + '">' + KINDS[k] + '</option>').join('') + '</select><button type="button">추가</button></div></div>';
  }).join('') + '</div>';
  bind();
  if (S.refocus) { const c = document.querySelector('#people .card[data-who="' + CSS.escape(S.refocus) + '"] .add input'); if (c) c.focus(); S.refocus = null; }
}
// 일정 · 전달 사항: 누구나 올리고 지움 (올린 사람 이름을 함께 남김)
async function ntAdd() {
  const t = clean($('ntT').value, 120), byDate = $('ntK').value === 'date', dv = $('ntD').value, d = byDate && dv ? Number(dv.replace(/-/g, '')) : 0;
  if (!t) { $('ntT').focus(); return; }
  if (byDate && !d) { $('ntD').focus(); toast('날짜를 골라 주세요'); return; }  /* 계속 = d 0 (지울 때까지) */
  const me = S.roster.find(m => m.id === S.me);
  $('ntAdd').disabled = true;
  try { await addDoc(collection(db, 'team_notice'), { t, d, at: serverTimestamp(), by: me ? tName(me) : '직원' }); $('ntT').value = ''; $('ntD').value = ''; toast('전달 사항을 올렸어요'); }
  catch (e) { toast('올리기 실패: ' + errMsg(e)); }
  $('ntAdd').disabled = false;
}
$('ntAdd').addEventListener('click', ntAdd);
$('ntK').addEventListener('change', () => { $('ntD').classList.toggle('hide', $('ntK').value !== 'date'); if ($('ntK').value === 'date') $('ntD').focus(); });
$('ntT').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ntAdd(); } });
$('notices').addEventListener('click', async e => {
  const b = e.target.closest('[data-ntdel]'); if (!b) return;
  const n = S.notices.find(x => x.id === b.dataset.ntdel); if (!n || !confirm('"' + n.t + '"를 지울까요?\n(모든 사람 화면에서 사라져요)')) return;
  try { await deleteDoc(doc(db, 'team_notice', n.id)); toast('지웠어요'); } catch (err) { toast('지우기 실패: ' + errMsg(err)); }
});
function bind() {
  document.querySelectorAll('#people .card[data-who]').forEach(card => {
    const who = card.dataset.who, inp = card.querySelector('.add input'), sel = card.querySelector('.add select'), btn = card.querySelector('.add button');
    const add = async () => {
      const t = clean(inp.value); if (!t) { inp.focus(); return; }
      const me = S.roster.find(m => m.id === S.me);
      btn.disabled = true;
      try { await addDoc(collection(db, 'pos_todo'), { who, t, kind: sel.value, s: S.date, e: 0, done: {}, at: serverTimestamp(), by: me ? me.name : '직원', src: 'staff' }); inp.value = ''; S.refocus = who; render(true); toast('추가했어요'); }
      catch (e) { toast('추가 실패: ' + errMsg(e)); btn.disabled = false; }
    };
    btn.addEventListener('click', add);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    card.querySelectorAll('.li').forEach(li => {
      const t = S.tasks.find(x => x.id === li.dataset.id); if (!t) return;
      li.querySelector('input[type=checkbox]').addEventListener('change', async e => {
        const k = keyOf(t, S.date), v = e.target.checked;
        try { await setDoc(doc(db, 'pos_todo', t.id), { done: { [k]: v } }, { merge: true }); }
        catch (err) { e.target.checked = !v; toast('저장 실패: ' + errMsg(err)); }
      });
      const ed = li.querySelector('[data-edit]');
      if (ed) ed.addEventListener('click', () => {
        const i = document.createElement('input'); i.type = 'text'; i.className = 'ed'; i.maxLength = 60; i.value = t.t; i.setAttribute('aria-label', '할 일 고치기');
        ed.replaceWith(i); i.focus(); i.select();
        let fin = false;
        const finish = async ok => {
          if (fin) return; fin = true;
          const v = clean(i.value);
          i.blur();
          if (!ok || !v || v === t.t) { render(true); return; }
          try { await setDoc(doc(db, 'pos_todo', t.id), { t: v }, { merge: true }); } catch (err) { toast('고치기 실패: ' + errMsg(err)); }
          render(true);
        };
        i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); finish(true); } else if (e.key === 'Escape') finish(false); });
        i.addEventListener('blur', () => finish(true));
      });
      const del = li.querySelector('[data-del]');
      if (del) del.addEventListener('click', async () => {
        if (!confirm('"' + t.t + '" 할 일을 지울까요?')) return;
        try { await deleteDoc(doc(db, 'pos_todo', t.id)); } catch (err) { toast('지우기 실패: ' + errMsg(err)); }
      });
    });
  });
}
</script>
